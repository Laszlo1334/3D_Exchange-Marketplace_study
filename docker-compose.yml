services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: market_database
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  s3mock:
    image: adobe/s3mock
    ports:
      - "9090:9090"
    environment:
      - initialBuckets=3d-models-bucket

volumes:
  pgdata: