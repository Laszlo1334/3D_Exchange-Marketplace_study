spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/market_database
    username: admin
    password: password
    Driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
        hibernate:
          format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true